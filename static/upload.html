<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voice PHQ-9 Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .chat-box {
      border: 1px solid #ddd;
      padding: 1rem;
      height: 300px;
      overflow-y: auto;
      background: #fff;
      margin-bottom: 1rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }
    .msg.user { background: #dcf8c6; align-self: flex-end; }
    .msg.bot  { background: #e7e7e7; align-self: flex-start; }
    .msg {
      padding: 0.5rem 1rem;
      margin: 0.5rem 0;
      border-radius: 15px;
      max-width: 80%;
      white-space: pre-line;
    }
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .text-input-container {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .text-input-container input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .text-input-container button {
      padding: 0.75rem 1.5rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    .text-input-container button:hover {
      background: #0056b3;
    }
    .text-input-container button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #start-btn {
      background: #132142;
      color: white;
    }
    #stop-btn {
      background: #d29ca2;
      color: white;
    }
    #restart-btn {
      background: #6c757d;
      color: white;
    }
    .status-indicator {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
    .status-indicator.speaking {
      color: #c2b8b9;
      font-weight: bold;
    }
    .status-indicator.recording {
      color: #28a745;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🧠 Voice PHQ-9 Bot</h2>
    
    <div class="status-indicator" id="status">Ready to start</div>
    
    <div class="chat-box" id="chat-box"></div>

    <div class="text-input-container">
      <input 
        type="text" 
        id="text-input" 
        placeholder="Type your response here..." 
        disabled
      />
      <button id="send-text-btn" disabled>Send</button>
    </div>

    <div class="controls">
      <button id="start-btn" disabled>🎙️ Start Recording</button>
      <button id="stop-btn" disabled>⏹️ Stop Recording</button>
      <button id="restart-btn">🔄 Restart</button>
    </div>

    <div id="loading" style="text-align:center; display:none;">
      <p>🌀 Processing voice...</p>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const restartBtn = document.getElementById('restart-btn');
    const loading = document.getElementById('loading');
    const textInput = document.getElementById('text-input');
    const sendTextBtn = document.getElementById('send-text-btn');
    const statusIndicator = document.getElementById('status');

    let recorder;
    let audioChunks = [];
    let isBotSpeaking = false;
    let hasStarted = false;

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = 'msg ' + sender;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function updateStatus(text, className = '') {
      statusIndicator.textContent = text;
      statusIndicator.className = 'status-indicator ' + className;
    }

    function updateButtonStates() {
      // Disable recording buttons while bot is speaking
      startBtn.disabled = isBotSpeaking || !hasStarted;
      
      // Enable text input only after assessment has started
      textInput.disabled = !hasStarted || isBotSpeaking;
      sendTextBtn.disabled = !hasStarted || isBotSpeaking || !textInput.value.trim();
    }

    async function speak(text) {
      try {
        isBotSpeaking = true;
        updateStatus('🔊 Bot is speaking...', 'speaking');
        updateButtonStates();

        const res = await fetch('/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!res.ok) throw new Error("TTS request failed");

        const blob = await res.blob();
        const audioURL = URL.createObjectURL(blob);
        const audio = new Audio(audioURL);
        
        return new Promise((resolve) => {
          audio.onended = () => {
            isBotSpeaking = false;
            updateStatus('Ready for your response');
            updateButtonStates();
            resolve();
          };
          audio.play();
        });
      } catch (err) {
        console.error("Error calling TTS:", err);
        isBotSpeaking = false;
        updateButtonStates();
      }
    }

    async function sendStart() {
      const res = await fetch('/phq', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_response: "start" })
      });
      const data = await res.json();
      addMessage(data.bot_message, 'bot');
      // First message is text-only, no speech
      hasStarted = true;
      updateStatus('Assessment started - please respond');
      updateButtonStates();
    }

    window.onload = () => sendStart();

    startBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);
      audioChunks = [];

      recorder.ondataavailable = e => audioChunks.push(e.data);
      recorder.onstop = async () => {
        loading.style.display = 'block';
        updateStatus('Processing voice...');
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const file = new File([blob], 'voice.webm', { type: 'audio/webm' });
        await sendAudio(file);
        loading.style.display = 'none';
      };

      recorder.start();
      updateStatus('🎙️ Recording...', 'recording');
      stopBtn.disabled = false;
      startBtn.disabled = true;
    };

    stopBtn.onclick = () => {
      recorder.stop();
      stopBtn.disabled = true;
      updateStatus('Processing...');
    };

    sendTextBtn.onclick = async () => {
      const text = textInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      textInput.value = '';
      updateButtonStates();

      await processUserResponse(text);
    };

    textInput.addEventListener('input', updateButtonStates);

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !sendTextBtn.disabled) {
        sendTextBtn.click();
      }
    });

    restartBtn.onclick = async () => {
      await fetch('/phq/reset', { method: 'POST' });
      chatBox.innerHTML = '';
      hasStarted = false;
      isBotSpeaking = false;
      updateButtonStates();
      sendStart();
    };

    async function sendAudio(file) {
      const fd = new FormData();
      fd.append('file', file);

      const res = await fetch('/transcribe', { method: 'POST', body: fd });
      const { transcript } = await res.json();
      addMessage(transcript, 'user');

      await processUserResponse(transcript);
    }

    async function processUserResponse(response) {
      const phqRes = await fetch('/phq', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_response: response })
      });

      const data = await phqRes.json();
      if (data.bot_message) {
        addMessage(data.bot_message, 'bot');
        await speak(data.bot_message);
      }
    }
  </script>
</body>
</html>
